<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- PNG favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Android/Chrome icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png"
    />

    <!-- Primary Meta Tags -->
    <title>CS2 Major Capsule Tracker | CS Market Forum</title>
    <meta name="title" content="CS2 Major Capsule Tracker | CS Market Forum" />
    <meta
      name="description"
      content="Track CS:GO & CS2 Major capsule introduction, sale, and removal dates with visual charts and timelines."
    />

    <link rel="canonical" href="https://sale.csmarket.forum/" />

    <!-- Open Graph: Discord, Facebook, Slack, Telegram, WhatsApp, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CS Market Forum" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://sale.csmarket.forum/" />
    <meta property="og:title" content="CS2 Major Capsule Tracker | CS Market Forum" />
    <meta
      property="og:description"
      content="Track CS:GO & CS2 Major capsule introduction, sale, and removal dates with visual charts and timelines."
    />
    <!-- Card source: scripts/og-preview.html -->
    <meta property="og:image" content="https://sale.csmarket.forum/preview.png" />
    <meta property="og:image:secure_url" content="https://sale.csmarket.forum/preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Major Capsule Tracker: logos of every CS Major from Katowice 2014 to Cologne 2026"
    />

    <!-- X / Twitter (reads name=, falls back to og: for anything missing) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CS2 Major Capsule Tracker | CS Market Forum" />
    <meta
      name="twitter:description"
      content="Track CS:GO & CS2 Major capsule introduction, sale, and removal dates with visual charts and timelines."
    />
    <meta name="twitter:image" content="https://sale.csmarket.forum/preview.png" />
    <meta
      name="twitter:image:alt"
      content="Major Capsule Tracker: logos of every CS Major from Katowice 2014 to Cologne 2026"
    />

    <meta name="theme-color" content="#1b1d24" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
